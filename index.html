<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensum Interactivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1 id="pensum-title">Pensum Interactivo</h1>
            <div class="selector-container">
                <label for="career-select" class="selector-label">Selecciona tu Carrera:</label>
                <div class="career-select-wrapper">
                    <select id="career-select" class="career-dropdown">
                        <option value="cdat.json">Ciencia de Datos</option>
                        <option value="matem.json">Matemáticas</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="global-credits" class="global-credits">
            Créditos cursados: <span id="credits-count">0</span> / <span id="total-credits-count">0</span>
        </div>
        <div id="pensum-container"></div>
        
        <div class="planner-section">
            <button id="add-semester-btn" class="planner-btn">Agregar semestre</button>
            <div id="semesters-list"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
