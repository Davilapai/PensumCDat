<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensum de Ciencia de Datos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1 id="pensum-title">Pensum de Ciencia de Datos</h1>
        </div>
        <div id="global-credits" class="global-credits">
            Créditos cursados / planeados: <span id="credits-count">0</span> / <span id="total-credits-count">0</span>
        </div>

        <!-- Vista Tradicional por Semestres -->
        <div id="pensum-container"></div>
        
        <div id="planner-section" class="planner-section">
            <button id="add-semester-btn" class="planner-btn">Agregar semestre</button>
            <div id="semesters-list"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
